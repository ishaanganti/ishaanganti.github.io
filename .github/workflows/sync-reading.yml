name: Sync Notion Content

on:
  push:
    paths:
      - 'scripts/sync_aeropress.py'
      - 'scripts/sync_reading.py'
      - '.github/workflows/sync-reading.yml'
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync reading list from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
        run: |
          git pull --rebase origin main
          python scripts/sync_reading.py
      - name: Sync Aeropress experiments from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_AEROPRESS_PAGE_ID: 3e202030da15800e8ea8f1091728b540
        run: python scripts/sync_aeropress.py
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git add aeropress.html
          [ -d readings ] && git add readings/ || true
          git diff --staged --quiet || git commit -m "sync: reading list from Notion"
          git push
